<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <title>Content Manager</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script>
      const identityHashParams = new URLSearchParams(
        window.location.hash.replace(/^#/, ""),
      );
      const hasIdentityToken = [
        "invite_token",
        "confirmation_token",
        "recovery_token",
        "access_token",
        "email_change_token",
      ].some((token) => identityHashParams.has(token));

      function loadDecapCms() {
        if (document.querySelector("script[data-decap-cms]")) return;

        const script = document.createElement("script");
        script.src = "https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js";
        script.setAttribute("data-decap-cms", "true");
        document.body.appendChild(script);
      }

      if (hasIdentityToken) {
        window.location.replace(`/admin/callback/${window.location.hash}`);
      } else {
        loadDecapCms();
      }
    </script>
  </body>
</html>
