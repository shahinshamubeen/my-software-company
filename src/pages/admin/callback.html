<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Complete Registration</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #050505;
        color: #ffffff;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(100% - 32px, 420px);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
        line-height: 1.2;
      }

      p {
        margin: 0 0 20px;
        color: #b8b8b8;
        line-height: 1.6;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 12px 16px;
        background: #b6ff4d;
        color: #050505;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid #ffffff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Complete Registration</h1>
      <p id="status">Opening the secure registration form...</p>
      <button
        id="continue-button"
        type="button"
        data-netlify-identity-button
      >
        Continue
      </button>
    </main>

    <script>
      const identityHashParams = new URLSearchParams(
        window.location.hash.replace(/^#/, ""),
      );
      const hasIdentityToken = [
        "invite_token",
        "confirmation_token",
        "recovery_token",
        "access_token",
        "email_change_token",
      ].some((token) => identityHashParams.has(token));
      const status = document.getElementById("status");
      const continueButton = document.getElementById("continue-button");

      function goToAdmin() {
        window.location.replace("/admin/");
      }

      function openIdentityFlow() {
        if (!window.netlifyIdentity) {
          status.textContent = "The registration form could not load. Refresh the page and try again.";
          return;
        }

        window.netlifyIdentity.open();
      }

      if (!hasIdentityToken) {
        goToAdmin();
      } else if (window.netlifyIdentity) {
        window.netlifyIdentity.on("login", goToAdmin);
        window.netlifyIdentity.on("open", () => {
          status.textContent = "Finish registration in the secure form.";
        });
        window.netlifyIdentity.on("error", () => {
          status.textContent = "The registration form could not open. Try refreshing this page.";
        });
        window.netlifyIdentity.on("close", () => {
          if (window.netlifyIdentity.currentUser()) {
            goToAdmin();
            return;
          }

          status.textContent = "Click Continue to reopen the registration form.";
        });
        window.netlifyIdentity.on("init", (user) => {
          if (user) {
            goToAdmin();
            return;
          }

          window.setTimeout(openIdentityFlow, 100);
        });
        window.setTimeout(openIdentityFlow, 1200);
      } else {
        status.textContent = "The registration form could not load. Refresh the page and try again.";
      }

      continueButton.addEventListener("click", openIdentityFlow);
    </script>
  </body>
</html>
